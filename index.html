<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYD - WhereYouDey</title>
    <!-- Tailwind CSS CDN Module -->
    <script src="https://tailwindcss.com"></script>
    <!-- Google Fonts: Roboto Configuration -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Vector Icons Engine -->
    <script src="https://unpkg.com"></script>
    <style>
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: #FFFFFF; 
            color: #1C1B1F; 
            -webkit-tap-highlight-color: transparent;
        }
        .view-panel { display: none; }
        .view-panel.active { display: flex; }
        .m3-nav-active { color: #00875A !important; font-weight: 500; }
        .m3-nav-active i { stroke: #00875A !important; fill: rgba(0, 135, 90, 0.1); }
    </style>
</head>
<body class="flex flex-col min-h-screen max-w-md mx-auto bg-white shadow-2xl relative overflow-x-hidden">

    <!-- SPLASH SCREEN LOADER LAYER -->
    <div id="splash-screen" class="fixed inset-0 bg-[#00875A] z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-24 h-24 rounded-full bg-white flex items-center justify-center shadow-lg animate-pulse">
            <span class="text-[#00875A] text-5xl font-bold tracking-tighter">W</span>
        </div>
    </div>

    <!-- MAIN APP SCREEN FRAME OVERLAY -->
    <header id="global-header" class="bg-white px-4 py-3 flex items-center justify-between z-40 border-b border-zinc-100">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-[#00875A] flex items-center justify-center text-white font-bold text-sm">W</div>
            <span class="font-bold text-xl tracking-tight text-[#1C1B1F]">WYD</span>
        </div>
        <button onclick="checkLocationServices()" class="flex items-center gap-1 bg-[#E6F3ED] text-[#00875A] px-3 py-1.5 rounded-full text-xs font-medium transition hover:opacity-90">
            <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
            <span id="global-location-tag">Locating...</span>
        </button>
    </header>

    <!-- CONTENT BODY CONTAINER SHELLS -->
    <main class="flex-1 relative flex flex-col">
        <!-- SCREEN 1: CENTERED PLAIN SEARCH SYSTEM -->
        <section id="view-home" class="view-panel active flex-col flex-1 items-center justify-center px-6 -mt-14">
            <div class="w-full max-w-sm space-y-6 flex flex-col items-center">
                <h1 class="text-2xl font-bold tracking-tight text-zinc-900 text-center w-full">What do you need right now?</h1>
                <div class="w-full relative shadow-sm border border-zinc-200 rounded-full bg-white focus-within:ring-2 focus-within:ring-[#00875A] focus-within:border-transparent transition overflow-hidden">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-zinc-400">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </div>
                    <input type="text" id="main-search-input" onkeyup="handleSearchTrigger(event)" placeholder="Search anything..." class="w-full pl-12 pr-12 py-3.5 text-base bg-transparent focus:outline-none placeholder-zinc-400">
                </div>
            </div>
            <!-- Dynamic Results Target Area -->
            <div id="search-results-wrapper" class="w-full max-w-sm mt-6 hidden"></div>
        </section>

        <!-- SUB PANEL WINDOWS LAYOUTS -->
        <section id="view-my-business" class="view-panel flex-col flex-1 p-4 hidden"><h2 class="text-xl font-bold">My Business</h2></section>
        <section id="view-confirm" class="view-panel flex-col flex-1 p-4 hidden"><h2 class="text-xl font-bold">Verification Center</h2></section>
        <section id="view-reviews" class="view-panel flex-col flex-1 p-4 hidden"><h2 class="text-xl font-bold">Reviews Log</h2></section>
        <section id="view-complaints" class="view-panel flex-col flex-1 p-4 hidden"><h2 class="text-xl font-bold">Complaints & Disputes</h2></section>
    </main>

    <!-- BOTTOM FIXED CONTROLS PANEL UTILITY SHELF -->
    <nav class="fixed bottom-0 max-w-md mx-auto inset-x-0 bg-white border-t border-zinc-200 py-2 flex items-center justify-around z-50">
        <button onclick="navigateToTab('my-business')" id="nav-btn-my-business" class="flex flex-col items-center gap-0.5 text-zinc-400 py-1 flex-1 text-center transition">
            <i data-lucide="briefcase" class="w-5 h-5"></i>
            <span class="text-[10px]">my business</span>
        </button>
        <button onclick="navigateToTab('confirm')" id="nav-btn-confirm" class="flex flex-col items-center gap-0.5 text-zinc-400 py-1 flex-1 text-center transition"><i data-lucide="shield" class="w-5 h-5"></i><span class="text-[10px]">confirm</span></button>
        <button onclick="navigateToTab('reviews')" id="nav-btn-reviews" class="flex flex-col items-center gap-0.5 text-zinc-400 py-1 flex-1 text-center transition"><i data-lucide="message-square-text" class="w-5 h-5"></i><span class="text-[10px]">reviews</span></button>
        <button onclick="navigateToTab('complaints')" id="nav-btn-complaints" class="flex flex-col items-center gap-0.5 text-zinc-400 py-1 flex-1 text-center transition"><i data-lucide="alert-triangle" class="w-5 h-5"></i><span class="text-[10px]">complaints</span></button>
    </nav>

    <!-- CORE OPERATION LOGIC SYSTEMS RUNNER -->
    <script>
        function checkLocationServices() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (p) => { 
                        document.getElementById('global-location-tag').innerText = "Current Location"; 
                        clearSplash(); 
                    },
                    (e) => { 
                        document.getElementById('global-location-tag').innerText = "Abuja FCT"; 
                        clearSplash(); 
                    },
                    { timeout: 5000 }
                );
            } else {
                document.getElementById('global-location-tag').innerText = "Abuja FCT";
                clearSplash();
            }
        }

        function clearSplash() {
            const splash = document.getElementById('splash-screen');
            if(splash) { 
                splash.classList.add('opacity-0'); 
                setTimeout(() => splash.remove(), 500); 
            }
        }

        function navigateToTab(tabId) {
            const btn = document.getElementById(`nav-btn-${tabId}`);
            const panel = document.getElementById(`view-${tabId}`);
            
            // Toggle reset controls arrays
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('m3-nav-active'));
            document.querySelectorAll('.view-panel').forEach(p => {
                p.classList.remove('active');
                p.classList.add('hidden');
            });

            if (btn.hasAttribute('data-active-tab')) {
                btn.removeAttribute('data-active-tab');
                const home = document.getElementById('view-home');
                home.classList.add('active');
                home.classList.remove('hidden');
                document.getElementById('global-header').classList.remove('hidden');
                lucide.createIcons();
                return;
            }

            document.querySelectorAll('nav button').forEach(b => b.removeAttribute('data-active-tab'));
            btn.setAttribute('data-active-tab', 'true');
            
            panel.classList.add('active');
            panel.classList.remove('hidden');
            btn.classList.add('m3-nav-active');
            document.getElementById('global-header').classList.add('hidden');
            lucide.createIcons();
        }

        function handleSearchTrigger(event) {
            const val = event.target.value.trim();
            const wrap = document.getElementById('search-results-wrapper');
            if(val.length > 0) wrap.classList.remove('hidden');
            else wrap.classList.add('hidden');
        }

        window.onload = function() { 
            lucide.createIcons(); 
            checkLocationServices(); 
        };
    </script>
</body>
</html>
